# GitLab CI — the canonical pipeline for this repo (origin is the
# self-hosted GitLab at gitlab.beluga-sirius.ts.net; the GitHub workflow in
# .github/workflows/ci.yml is retained only for a potential GitHub mirror).
#
# Stages mirror decisions/39 + decisions/41:
#   gate    — the hard wall: check, test, all seven guards, build, storybook
#   verify  — the Chrome-for-Testing harness under xvfb; allow_failure on
#             this first iteration until real-runner behaviour is observed
#             (decision 39's posture: weaken only on evidence, and the gate
#             job is the wall either way)
#   package — npm run package (store validations + deterministic zip);
#             uploads the zip as a job artifact, and on v* tags also to the
#             Generic Package Registry so the release asset link is durable
#   release — on v* tags: create the GitLab Release with the zip attached
#
# Tag/version discipline: a v* tag must equal package.json's version; the
# package job fails the pipeline on mismatch before anything is published.

stages: [gate, verify, package, release]

default:
  image: node:24-bookworm
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]

.npm-install: &npm-install
  - npm ci --cache .npm --prefer-offline

gate:
  stage: gate
  script:
    - *npm-install
    - npm run check
    - npm test
    - npm run guard
    - npm run build
    - npm run build-storybook
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

verify:
  stage: verify
  allow_failure: true
  # 40m + cache saved even on failure: the first real run timed out at 25m
  # with a cold Chrome-for-Testing cache, and GitLab's default cache:when
  # on_success meant the failed run saved nothing for the next (v0.5.0).
  timeout: 40m
  script:
    - apt-get update -qq && apt-get install -y -qq xvfb
      libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0
      libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2
      libpango-1.0-0 libcairo2 fonts-liberation
    - *npm-install
    - xvfb-run --auto-servernum -- npm run verify
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm/]
    - key: cft-$CI_JOB_IMAGE
      paths: [.chrome-for-testing/]
      when: always
  artifacts:
    when: always
    expire_in: 14 days
    paths: [verify/output/screenshots/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/

package:
  stage: package
  needs: [gate]
  before_script:
    - apt-get update -qq && apt-get install -y -qq zip unzip
  script:
    - *npm-install
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        PKG_VERSION="$(node -p "require('./package.json').version")"
        if [ "v$PKG_VERSION" != "$CI_COMMIT_TAG" ]; then
          echo "Tag $CI_COMMIT_TAG does not match package.json version $PKG_VERSION" >&2
          exit 1
        fi
      fi
    - npm run package
    - ZIP="$(ls openchat-webmcp-*.zip)"; echo "ZIP_NAME=$ZIP" > package.env
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$ZIP" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/openchat-webmcp/$CI_COMMIT_TAG/$ZIP"
        echo "uploaded $ZIP to the generic package registry under $CI_COMMIT_TAG"
      fi
  artifacts:
    expire_in: 90 days
    paths: [openchat-webmcp-*.zip]
    reports:
      dotenv: package.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/

release:
  stage: release
  needs: [package]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  cache: []
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "OpenChat (WebMCP) $CI_COMMIT_TAG"
    description: "Chrome extension build. The attached zip is the store-ready
      artifact produced by npm run package (manifest at the zip root, all ten
      locales validated — decisions/41)."
    assets:
      links:
        - name: "$ZIP_NAME (store upload)"
          # $ZIP_NAME arrives via the package job's dotenv report — GitLab
          # does NOT expand shell parameter operations like ${VAR#v} in
          # release YAML, which produced a dangling link on v0.5.0's first
          # release (patched live via the API).
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/openchat-webmcp/$CI_COMMIT_TAG/$ZIP_NAME"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
